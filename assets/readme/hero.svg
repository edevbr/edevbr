<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Evandro Fonseca Junior</title>
  <desc id="desc">Backend engineer who builds APIs and the integrations that connect IoT devices, web apps and mobile apps to a PostgreSQL database. His code is hosted on his own Gitea server at git.evandro.dev.br.</desc>

  <rect width="1200" height="420" rx="24" fill="#0a0a0a"/>

  <g id="title-block" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
    <text x="64" y="132" font-size="68" font-weight="700" fill="#f4f2ed">Evandro Fonseca</text>
    <text x="64" y="208" font-size="68" font-weight="700" fill="#f4f2ed">Junior</text>
    <text x="64" y="268" font-size="28" fill="#f4f2ed">Backend engineer: APIs and integrations</text>
    <text x="64" y="306" font-size="28" fill="#f4f2ed">for IoT devices, web and mobile apps.</text>
    <text x="64" y="360" font-size="20" fill="#ccff00" font-family="ui-monospace, &quot;SF Mono&quot;, Consolas, monospace">TypeScript · Python · NestJS · PostgreSQL</text>
  </g>

  <g id="integration-map" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif" font-size="20">
    <g id="sources" fill="#161616" stroke="#3a3a38" stroke-width="2">
      <rect x="712" y="72" width="148" height="48" rx="10"/>
      <rect x="712" y="138" width="148" height="48" rx="10"/>
      <rect x="712" y="204" width="148" height="48" rx="10"/>
    </g>
    <g fill="#f4f2ed" text-anchor="middle">
      <text x="786" y="103">IoT devices</text>
      <text x="786" y="169">web apps</text>
      <text x="786" y="235">mobile apps</text>
    </g>

    <g id="links" fill="none" stroke="#ccff00" stroke-width="3" stroke-linecap="round">
      <path d="M860 96 C 892 96, 892 146, 920 146"/>
      <path d="M860 162 L 920 162"/>
      <path d="M860 228 C 892 228, 892 178, 920 178"/>
      <path d="M1022 162 L 1046 162"/>
    </g>

    <g id="api">
      <rect x="920" y="118" width="102" height="88" rx="12" fill="#ccff00"/>
      <text x="971" y="171" text-anchor="middle" font-size="28" font-weight="700" fill="#0a0a0a">API</text>
    </g>

    <g id="database" stroke="#f4f2ed" stroke-width="2" fill="#161616">
      <path d="M1046 132 L1046 192 A50 13 0 0 0 1146 192 L1146 132"/>
      <ellipse cx="1096" cy="132" rx="50" ry="13"/>
    </g>
    <text x="1096" y="236" text-anchor="middle" font-size="18" fill="#a6a59f">PostgreSQL</text>

    <g id="own-server">
      <rect x="712" y="290" width="434" height="62" rx="12" fill="#161616" stroke="#3a3a38" stroke-width="2"/>
      <circle cx="740" cy="321" r="6" fill="#ccff00"/>
      <text x="760" y="328" fill="#f4f2ed" font-family="ui-monospace, &quot;SF Mono&quot;, Consolas, monospace">git.evandro.dev.br</text>
      <text x="1126" y="327" text-anchor="end" font-size="18" fill="#a6a59f">self-hosted</text>
    </g>
  </g>
</svg>
